<div class="min-h-screen bg-[#F5F7FB] flex items-center justify-center p-6 font-sans relative overflow-hidden">
  <!-- Decorative background elements -->
  <div class="absolute top-0 left-0 w-full h-80 bg-gradient-to-r from-[#00B8D4] to-[#0097A7] z-0">
    <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 40px 40px;"></div>
  </div>

  <div class="w-full max-w-2xl relative z-10">
    <div class="text-center mb-8">
      <div class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-white text-[#00B8D4] shadow-xl mb-6 cursor-pointer transform hover:scale-110 transition-transform" routerLink="/">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <h1 class="text-3xl font-black tracking-tight text-white leading-none">fichar<span class="opacity-60">APP</span></h1>
      <p class="text-white/70 mt-3 font-bold uppercase tracking-widest text-[10px]">Crea tu cuenta de empleado</p>
    </div>

    <div class="bg-white p-10 rounded-[2.5rem] shadow-2xl shadow-blue-900/10">
      <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Nombre -->
          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 px-1">Nombre</label>
            <input 
              type="text" 
              formControlName="nombre"
              placeholder="Tu nombre"
              class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00B8D4] transition-all text-gray-800 placeholder:text-gray-300 text-sm font-bold"
            >
          </div>

          <!-- Puesto -->
          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 px-1">Puesto de trabajo</label>
            <input 
              type="text" 
              formControlName="puesto"
              placeholder="Ej: Desarrollador"
              class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00B8D4] transition-all text-gray-800 placeholder:text-gray-300 text-sm font-bold"
            >
          </div>

          <!-- Apellido 1 -->
          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 px-1">Primer Apellido</label>
            <input 
              type="text" 
              formControlName="apellido1"
              placeholder="Apellido"
              class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00B8D4] transition-all text-gray-800 placeholder:text-gray-300 text-sm font-bold"
            >
          </div>

          <!-- Apellido 2 -->
          <div>
            <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 px-1">Segundo Apellido</label>
            <input 
              type="text" 
              formControlName="apellido2"
              placeholder="Opcional"
              class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00B8D4] transition-all text-gray-800 placeholder:text-gray-300 text-sm font-bold"
            >
          </div>

          <!-- Email -->
          <div class="md:col-span-2">
            <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 px-1">Email Corporativo</label>
            <input 
              type="email" 
              formControlName="email"
              placeholder="nombre@empresa.com"
              class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00B8D4] transition-all text-gray-800 placeholder:text-gray-300 text-sm font-bold"
            >
          </div>

        </div>

        <!-- Password -->
        <div>
          <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 px-1">Contraseña</label>
          <input 
            type="password" 
            formControlName="password"
            placeholder="••••••••"
            class="w-full bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 focus:outline-none focus:border-[#00B8D4] transition-all text-gray-800 placeholder:text-gray-300 text-sm font-bold"
          >
        </div>

        @if (errorMessage()) {
          <div class="bg-red-50 text-red-500 p-3 rounded-lg text-[10px] font-black uppercase text-center border border-red-100">
            {{ errorMessage() }}
          </div>
        }

        <button 
          type="submit" 
          [disabled]="registroForm.invalid || isLoading()"
          class="w-full h-14 bg-[#00B8D4] hover:bg-[#00ACC1] disabled:opacity-50 disabled:cursor-not-allowed text-white font-black uppercase tracking-widest text-xs rounded-xl shadow-lg shadow-teal-500/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2"
        >
          @if (isLoading()) {
            <span class="h-5 w-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            Creando cuenta...
          } @else {
            Registrarse
          }
        </button>
      </form>

      <div class="mt-8 text-center pt-4 border-t border-gray-50">
        <p class="text-gray-400 text-xs font-bold">
          ¿Ya tienes cuenta? 
          <a routerLink="/login" class="text-[#00B8D4] hover:underline transition-colors">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
